name: Sanity pass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browsers (chromium)
        run: python -m playwright install --with-deps chromium

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Full test suite: schema/API contract (offline-mocked upstreams),
      # Playwright behavioural UI (mocked /api/water_report), physics validation
      # + chain-solver fuzzing. All hermetic — no live USGS/NOAA/Open-Meteo calls.
      - name: Run Python test suite
        run: python -m pytest tests/ -v --tb=short

      # Instantaneous static linting only (no server, no DOM stub, no HTTP):
      # label[for] resolution, ARIA names, script load order ending in app.js,
      # sw.js SHELL_FILES parity, Vercel entry points, dead CSS, docs index.
      - name: Run static sanity pass
        run: node sanity_pass.cjs

      - name: Confirm no leftover dev servers
        run: |
          if pgrep -f "dev_server.py" >/dev/null; then
            echo "::error::A dev_server.py process leaked from the test suite"
            exit 1
          fi
          echo "hermetic: no leftover dev servers"
